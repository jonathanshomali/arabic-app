name: Deploy Yalla to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the app
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser for tests
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm test
      - name: Verify lesson audio coverage and files
        run: npm run voice:check
      - name: Test account flows
        run: npm run test:accounts
      - name: Verify database access rules
        run: npm run test:security
      - name: Test reviewed recording export
        run: python3 -m unittest discover -s scripts/voice -p 'test_contribution_export.py'
      - name: Build for GitHub Pages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:pages
      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
